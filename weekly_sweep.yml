name: RigIntel Weekly Email

on:
  schedule:
    - cron: '0 11 * * 2'  # Every Tuesday at 6:00 AM CDT (11:00 UTC)
  workflow_dispatch:        # Allows manual trigger from GitHub UI anytime

jobs:
  send-rig-intel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic sendgrid

      - name: Run RigIntel sweep and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python rig_intel_emailer.py
